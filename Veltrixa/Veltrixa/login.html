<!doctype html>
<!-- Login page (SRS 4.1). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veltrixa | Sign in</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-mode="auth" data-page="login" data-login-url="login.html" data-dashboard-url="dashboard.html" data-page-ext=".html">
  <div id="topLoader" class="top-loader" aria-hidden="true"></div>
  <div id="toastArea" class="toast-container position-fixed top-0 end-0 p-3" aria-live="polite"></div>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="brand-mark large" aria-label="Veltrixa logo">V</div>
      <h1>Welcome to Veltrixa</h1>
      <p class="muted">Sign in to manage your team's projects and tasks.</p>
      <div id="loginPanel">
        <form id="loginForm">
          <label class="form-label" for="loginEmail">Email address</label>
          <input class="form-control mb-3" id="loginEmail" type="email" required placeholder="name@example.com" value="athiqa@example.com">
          <label class="form-label" for="loginPassword">Password</label>
          <input class="form-control mb-3" id="loginPassword" type="password" required minlength="4" placeholder="Enter your password" value="demo1234">
          <label class="form-label" for="loginRole">Select your role</label>
          <select class="form-select mb-3" id="loginRole" required>
            <option value="" disabled selected>Choose your role</option>
            <option value="Administrator">Administrator</option>
            <option value="Project Manager">Project Manager</option>
            <option value="Team Leader">Team Leader</option>
            <option value="Team Member">Team Member</option>
          </select>
          <div id="loginError" class="auth-message small mb-2" role="alert" aria-live="polite"></div>
          <button class="btn btn-primary w-100" type="submit" id="loginButton">Sign in</button>
        </form>
        <p class="auth-switch">New to Veltrixa? <a class="link-button" href="register.html">Create an account</a></p>
        <div class="demo-roles"><small>Try a demo role (password <code>demo1234</code>)</small>
          <div class="demo-chips">
            <button type="button" class="chip" data-demo-email="admin@veltrixa.com" data-demo-password="admin1234" data-demo-role="Administrator">Administrator</button>
            <button type="button" class="chip" data-demo-email="athiqa@example.com" data-demo-password="demo1234" data-demo-role="Project Manager">Project Manager</button>
            <button type="button" class="chip" data-demo-email="rahul@example.com" data-demo-password="demo1234" data-demo-role="Team Leader">Team Leader</button>
            <button type="button" class="chip" data-demo-email="priya@example.com" data-demo-password="demo1234" data-demo-role="Team Member">Team Member</button>
          </div></div>
      </div>
      <p class="login-note">Demo mode: accounts are saved in this browser only. In production, sign-in is handled by the Java backend.</p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/mock-server.js"></script> <!-- demo backend, remove this line when the Java API is connected -->
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
